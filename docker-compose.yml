# ==============================================================================
# DRS (Dynamic Resource System) - Local Development Environment
# Empresa: E2S Labs
# ==============================================================================
# Como rodar o sistema base: docker-compose up -d
# Como rodar com a stack de métricas: docker-compose --profile observability up -d
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # FRONTEND (Nuxt 4 - Vue.js)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drs_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NUXT_PUBLIC_API_BASE=http://localhost:8000/api
    command: sh -c "npm install && npm run dev"
    networks:
      - drs_network

  # ----------------------------------------------------------------------------
  # BACKEND CORE (Laravel 12)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drs_backend
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-postgres}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - REDIS_HOST=redis
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: sh -c "composer install --no-interaction && php artisan serve --host=0.0.0.0 --port=80"
    networks:
      - drs_network

  # ----------------------------------------------------------------------------
  # BUSINESS INTELLIGENCE SERVICE (Python / FastAPI)
  # ----------------------------------------------------------------------------
  bi-service:
    build:
      context: ./bi-service
      dockerfile: Dockerfile
    container_name: drs_bi_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./bi-service:/app
    environment:
      - ENVIRONMENT=development
      - KAFKA_BROKER_URL=kafka:9092
      - POSTGRES_URL=postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-password}@postgres:5432/${DB_DATABASE:-postgres}
    depends_on:
      kafka:
        condition: service_healthy
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8001 --reload"
    networks:
      - drs_network

  # ----------------------------------------------------------------------------
  # INFRAESTRUTURA DE DADOS
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: drs_postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-postgres}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - drs_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - drs_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: drs_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - drs_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - drs_network

  # Apache Kafka
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: drs_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    volumes:
      - drs_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - drs_network

  # ----------------------------------------------------------------------------
  # OBSERVABILIDADE
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: drs_prometheus
    profiles: ["observability"]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - drs_network

  grafana:
    image: grafana/grafana:latest
    container_name: drs_grafana
    profiles: ["observability"]
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - drs_network

# ==============================================================================
# DEFINIÇÃO DE VOLUMES E REDES
# ==============================================================================
volumes:
  drs_pg_data:
    driver: local
  drs_redis_data:
    driver: local
  drs_kafka_data:
    driver: local

networks:
  drs_network:
    driver: bridge